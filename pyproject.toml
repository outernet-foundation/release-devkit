[project]
name = "release-devkit"
version = "0.0.0.dev0"
description = "Publication machinery: per-package tag ledger, path-diff change detection, ephemeral version patching, and registry adapters (nuget, npm/UPM, PyPI) driven by a declarative consumer-owned config"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "ci-devkit>=0.1.0",
    "packaging>=24.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "strictyaml>=1.7.3",
    "typer>=0.17.4",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.14.11",
    "pytest>=8.0.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
    "types-strictyaml>=1.7.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
app-build-version = "release_devkit.app_build_version:app"
create-release = "release_devkit.create_release:app"
ensure-release-pr = "release_devkit.ensure_release_pr:app"
fetch-ci-artifacts = "release_devkit.fetch_ci_artifacts:app"
publish-dev = "release_devkit.publish_dev:app"
publish-stable = "release_devkit.publish_stable:app"

[tool.hatch.build.targets.wheel]
packages = ["src/release_devkit"]
include = [
    "src/release_devkit/py.typed",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
