[project]
name = "release-devkit"
version = "0.0.0.dev0"
description = "Publication machinery: per-package tag ledger, path-diff change detection, ephemeral version patching, and registry adapters (nuget, npm/UPM, PyPI) driven by a declarative consumer-owned config"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "ci-devkit",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "pyyaml>=6.0.3",
    "strictyaml>=1.7.3",
    "typer>=0.17.4",
]

[tool.uv.sources]
ci-devkit = { git = "https://github.com/outernet-foundation/ci-devkit.git", rev = "bf9011df20c481f7ae6ffaed9581cd134f0512f2" }

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.14.11",
    "pytest>=8.0.0",
    "python-devkit>=0.1.0",
    "types-pyyaml>=6.0.12.20260906",
    "types-strictyaml>=1.7.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
get-app-version = "release_devkit.verbs.get_app_version:app"
lint-workflows = "release_devkit.verbs.lint_workflows:app"
merge-gate = "release_devkit.verbs.merge_gate:app"
prerelease = "release_devkit.verbs.prerelease:app"
release = "release_devkit.verbs.release:app"
validate-release-plan = "release_devkit.verbs.validate_release_plan:app"
update-pr-draft-release = "release_devkit.verbs.update_pr_draft:update_pr_app"

[tool.hatch.build.targets.wheel]
packages = ["src/release_devkit"]
include = [
    "src/release_devkit/py.typed",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
