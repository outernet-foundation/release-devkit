name: Merge gate

on:
  pull_request:
    branches: [dev]
    types: [labeled]
  workflow_run:
    workflows: [Integrate]
    types: [completed]

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}

permissions:
  contents: read

jobs:
  merge-gate:
    if: github.event.label.name == 'ready-to-merge' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the exact certified head SHA; the workflow_run payload carries no branch identity.
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          # Perform a full clone, required for validating fast forward: the gate proves dev is an ancestor before pushing.
          fetch-depth: 0
          # Remove credentials after checkout.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          save-cache: "false"
      - uses: ./.github/actions/setup-release-devkit
      - uses: actions/create-github-app-token@v3
        id: mint
        with:
          app-id: ${{ vars.MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
      - run: uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev merge-gate
        env:
          GITHUB_TOKEN: ${{ steps.mint.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
