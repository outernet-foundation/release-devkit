name: Merge gate

on:
  pull_request:
    branches: [dev]
    types: [labeled]

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}

permissions:
  contents: read

jobs:
  merge-gate:
    if: github.event.label.name == 'ready-to-merge'
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Perform a full clone, required so merge-gate can validate that this PR is a fast forward from dev
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          save-cache: "false"
      - uses: ./.github/actions/setup-release-devkit
      - uses: ./.github/actions/mint-token
        id: mint
        with:
          app-id: ${{ vars.MERGE_BOT_APP_ID }}
          private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
      - run: uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev merge-gate --head-sha ${{ github.event.pull_request.head.sha }}
        env:
          GITHUB_TOKEN: ${{ steps.mint.outputs.token }}
