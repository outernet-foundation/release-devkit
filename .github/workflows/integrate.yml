name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          save-cache: "false"
      - uses: ./.github/actions/setup-release-devkit
      - run: uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev lint-workflows

  preflight:
    needs: [lint-workflows]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Perform a full clone, required for tags
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          save-cache: "true"
      - run: uv run preflight-python
      - name: Self-test install
        run: >
          git clone https://github.com/outernet-foundation/release-devkit.git "$RUNNER_TEMP/release-devkit"
          && git -C "$RUNNER_TEMP/release-devkit" checkout ${{ github.event.pull_request.head.sha || github.sha }}
      - run: uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev validate-release-plan
      - name: Self-test merge-gate dry-run
        run: >
          uv run --project "$RUNNER_TEMP/release-devkit" --locked --no-dev
          merge-gate --head-sha ${{ github.event.pull_request.head.sha || github.sha }} --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
