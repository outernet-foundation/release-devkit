name: ensure-release-pr
description: Maintain the standing dev-to-main "Next release" gate PR

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - shell: bash
      run: uv sync --locked --no-dev
      working-directory: ${{ github.action_path }}/../../..
    - shell: bash
      run: '"$RELEASE_DEVKIT_ROOT/.venv/bin/ensure-release-pr"'
      env:
        RELEASE_DEVKIT_ROOT: ${{ github.action_path }}/../../..
        GH_TOKEN: ${{ github.token }}
