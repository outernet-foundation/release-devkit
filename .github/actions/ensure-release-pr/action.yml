name: ensure-release-pr
description: Maintain the standing dev-to-main "Next release" gate PR

inputs:
  checkout:
    description: Check out the consumer repo (ledger shape) before running; false when the job already holds it
    default: "true"

runs:
  using: composite
  steps:
    - if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true
        clean: false
        persist-credentials: false
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - shell: bash
      run: uv sync --locked --no-dev
      working-directory: ${{ github.action_path }}/../../..
    - shell: bash
      run: '"$RELEASE_DEVKIT_ROOT/.venv/bin/ensure-release-pr"'
      env:
        RELEASE_DEVKIT_ROOT: ${{ github.action_path }}/../../..
        GH_TOKEN: ${{ github.token }}
