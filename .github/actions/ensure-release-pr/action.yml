name: ensure-release-pr
description: Maintain the standing dev -> main "Next release" gate PR

inputs:
  ref:
    description: Checkout ref for the consumer repo (empty = event default)
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        clean: false
        persist-credentials: false

    - uses: astral-sh/setup-uv@v7

    - shell: bash
      run: uvx --from .release-devkit ensure-release-pr
