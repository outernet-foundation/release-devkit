name: ensure-release-pr
description: Maintain the standing dev-to-main "Next release" gate PR

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - shell: bash
      run: uv run --project "$GITHUB_WORKSPACE/.release-devkit" --locked --no-dev ensure-release-pr
      env:
        GH_TOKEN: ${{ github.token }}
