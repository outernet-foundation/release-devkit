name: publish-dev
description: Publish immutable -dev prereleases of path-diff-changed packages

inputs:
  ref:
    description: Checkout ref for the consumer repo (empty = event default)
    default: ""
  run-id:
    description: CI run id baked into every dev version
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        clean: false
        persist-credentials: false

    - run: git fetch --tags origin
      shell: bash

    - uses: astral-sh/setup-uv@v7

    - shell: bash
      run: uvx --from .release-devkit publish-dev --run-id ${{ inputs.run-id }}
      env:
        NPM_CONFIG_LOGLEVEL: verbose
