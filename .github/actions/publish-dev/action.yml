name: publish-dev
description: Publish immutable dev-channel prereleases of path-diff-changed packages

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - shell: bash
      run: uv sync --locked --no-dev
      working-directory: ${{ github.action_path }}/../../..
    - shell: bash
      run: '"$RELEASE_DEVKIT_ROOT/.venv/bin/publish-dev"'
      env:
        RELEASE_DEVKIT_ROOT: ${{ github.action_path }}/../../..
        GH_TOKEN: ${{ github.token }}
        NPM_CONFIG_LOGLEVEL: verbose
