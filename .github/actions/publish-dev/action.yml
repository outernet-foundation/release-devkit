name: publish-dev
description: Publish immutable dev-channel prereleases of path-diff-changed packages

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - shell: bash
      run: uv run --project "$GITHUB_WORKSPACE/.release-devkit" --locked --no-dev publish-dev
      env:
        GH_TOKEN: ${{ github.token }}
        NPM_CONFIG_LOGLEVEL: verbose
