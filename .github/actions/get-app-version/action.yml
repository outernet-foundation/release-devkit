name: get-app-version
description: Print the version a CI build of an app should stamp

inputs:
  app:
    description: App name from release-devkit.yaml
    required: true

outputs:
  version:
    description: The stamped version ({next_version}+{run})
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - id: version
      shell: bash
      run: >
        echo "version=$(uv run --project "$GITHUB_WORKSPACE/.release-devkit" --locked --no-dev
        get-app-version --app ${{ inputs.app }})" >> "$GITHUB_OUTPUT"
