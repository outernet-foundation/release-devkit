name: publish-stable
description: Publish changed packages to stable registries, push tags, and cut a GitHub Release

inputs:
  ref:
    description: Checkout ref for the consumer repo (empty = event default)
    default: ""
  fetch-ci-artifacts:
    description: Fetch CI build artifacts before publishing (for app releases)
    default: "false"
  with-apps:
    description: Handle app version bumps and tags in a filtered run
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        clean: false

    - run: git fetch --tags origin
      shell: bash

    - uses: astral-sh/setup-uv@v7

    - if: ${{ inputs.fetch-ci-artifacts == 'true' }}
      shell: bash
      run: uvx --from .release-devkit fetch-ci-artifacts

    - id: publish-stable
      shell: bash
      run: uvx --from .release-devkit publish-stable ${{ inputs.with-apps == 'true' && '--with-apps' || '' }}
      env:
        NPM_CONFIG_LOGLEVEL: verbose

    - if: ${{ steps.publish-stable.outputs.published == 'true' }}
      shell: bash
      run: uvx --from .release-devkit create-release
