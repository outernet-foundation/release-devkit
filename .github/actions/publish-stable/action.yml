name: publish-stable
description: Publish changed packages to stable registries, push tags, and cut the GitHub Release

inputs:
  checkout:
    description: Check out the consumer repo (ledger shape) before running; false when the job already holds it
    default: "true"
  dry-run:
    description: Print the publish plan and run plan-time validations without publishing
    default: "false"
  with-apps:
    description: Handle app version bumps and tags in a filtered run
    default: "false"

runs:
  using: composite
  steps:
    - if: ${{ inputs.checkout == 'true' }}
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.dry-run == 'true' && github.ref || 'main' }}
        fetch-depth: 0
        fetch-tags: true
        clean: false
        persist-credentials: ${{ inputs.dry-run != 'true' }}
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - shell: bash
      run: uv sync --locked --no-dev
      working-directory: ${{ github.action_path }}/../../..
    - shell: bash
      run: >-
        "$RELEASE_DEVKIT_ROOT/.venv/bin/publish-stable"
        ${{ inputs.dry-run == 'true' && '--dry-run' || '' }}
        ${{ inputs.with-apps == 'true' && '--with-apps' || '' }}
      env:
        RELEASE_DEVKIT_ROOT: ${{ github.action_path }}/../../..
        GH_TOKEN: ${{ github.token }}
        CI_REGISTRY_USERNAME: ${{ github.actor }}
        CI_REGISTRY_TOKEN: ${{ github.token }}
        NPM_CONFIG_LOGLEVEL: verbose
