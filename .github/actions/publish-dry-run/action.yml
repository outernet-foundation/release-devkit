name: publish-dry-run
description: Print the publish plan and run plan-time validations without publishing

inputs:
  ref:
    description: Checkout ref for the consumer repo (empty = event default)
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref }}
        clean: false
        fetch-depth: 0
        persist-credentials: false

    - uses: astral-sh/setup-uv@v7

    - shell: bash
      run: uvx --from .release-devkit publish-stable --dry-run
